name: Update Formula

on:
  repository_dispatch:
    types: [update-formula]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update formula
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          URL="${{ github.event.client_payload.url }}"
          SHA256="${{ github.event.client_payload.sha256 }}"

          echo "→ ${VERSION} · ${URL} · ${SHA256}"

          # Bytewise substitutions — the Formula template uses quoted strings
          # so sed on `url "..."` / `sha256 "..."` / `quicksilverpro==...` is safe.
          sed -i "s|url \".*\"|url \"${URL}\"|" Formula/qspro.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/qspro.rb
          sed -i "s|quicksilverpro==[0-9.]*\"|quicksilverpro==${VERSION}\"|" Formula/qspro.rb

      - name: Commit and push
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/qspro.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "qspro ${VERSION}"
          git push
